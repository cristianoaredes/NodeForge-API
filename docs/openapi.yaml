openapi: 3.1.0
info:
  title: Projeto Marcal API
  version: 1.0.0
  description: API documentation for Projeto Marcal using JWT authentication.
servers:
  - url: http://localhost:3001
paths:
  /:
    get:
      summary: Health check
      responses:
        '200':
          description: API is running
          content:
            text/plain:
              schema:
                type: string
  /auth/signup:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
        '400':
          description: User already exists
  /auth/login:
    post:
      summary: Login and get JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Invalid credentials
  /protected:
    get:
      summary: Access protected resource
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Protected resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
                    properties:
                      email:
                        type: string
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
