version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: projeto-marcal-api
    container_name: projeto-marcal-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=your_secure_jwt_secret_for_docker
    volumes:
      # For logs and persistent data
      - ./logs:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - app-network

  # You can uncomment and add a database service when needed
  # db:
  #   image: mongo:5
  #   container_name: projeto-marcal-db
  #   restart: unless-stopped
  #   ports:
  #     - "27017:27017"
  #   environment:
  #     - MONGO_INITDB_ROOT_USERNAME=root
  #     - MONGO_INITDB_ROOT_PASSWORD=example
  #   volumes:
  #     - dbdata:/data/db
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

# Uncomment when using database
# volumes:
#   dbdata: